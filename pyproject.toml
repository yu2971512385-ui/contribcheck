[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contribcheck"
version = "0.1.0"
description = "Look a repository over before spending an evening on a pull request"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yu2971512385-ui" }]
keywords = ["github", "open-source", "contributing", "triage", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/yu2971512385-ui/contribcheck"
Issues = "https://github.com/yu2971512385-ui/contribcheck/issues"

[project.scripts]
contribcheck = "contribcheck:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
py-modules = ["contribcheck"]

[tool.pytest.ini_options]
testpaths = ["test_contribcheck.py"]
